<script id="csinit" type="text/x-cindyscript">
//Script (CindyScript)
// parameters

N = 3;

tickCounter = 0;
speed =5;

pnt.size = 7;

cornerCol = [1, 1, 1];
choseCol = [1, 0, 0];
pntCol = [1, 1, 1];

next = A;
last = A;


reset() := (
	walk = [];
	next = A;
	last = A;
);

reset();
points = [];
walk = [];
allPoints = [A, B, C, D, E, F, G, H];
forall(allPoints,
	(
		#.visible=false;
		#.size = 10;
	);
);


updatePoints(new N) := (
	points = allPoints_(1..N);

	repeat(N, i,
		points_i.xy = (sin(i*2*pi/N), cos(i*2*pi/N));
	);

	forall(points, #.visible=true);
	forall(points, #.color=cornerCol);

	next = A;
	last = A;
);

rollDice() := (
	r = ceil(random()*N);
	next.color = cornerCol;
	next = points_r;
	next.color = choseCol;
);

setDir() := (
	stepSeg.visible = true;
	segS.xy = last.xy;
	segE.xy = next.xy;
);

newPoint() := (
	last = last + 1/2 * (next-last);
	pnt.xy = last.xy;
	walk = walk ++ [last.xy];
);

playanimation();

updatePoints(N);
rollDice();
newPoint();




;

</script>
<script id="csmousedrag" type="text/x-cindyscript">
//Script (CindyScript)
if(contains(allPoints, mover()),
    
    reset();
);
;

</script>
<script id="csdraw" type="text/x-cindyscript">
//Script (CindyScript)
drawall(walk, size -> 2, color -> pntCol, noborder -> true);
;
//Script (CindyScript)
speed = round((1-|spS, spP|/|spS, spE|)*50);
drawText(1/2*(spS + spE)-[0,.1], "Simulation Speed", 
	color -> [1,1,1],
	align -> "mid",
	size -> 20
);
;

drawText((screenbounds()_3).xy, "v2026MAY24 - Max Hoffmann",
    align -> "right",
    color -> [1, 1, 1],
    xoffset -> -15,
    yoffset -> 20
);

</script>
<script id="cstick" type="text/x-cindyscript">
//Script (CindyScript)
tickCounter = mod(tickCounter + 1, 4*speed);

// Wenn speed kleiner als 1 ist, schalten wir in den "Fast-Forward"-Modus
if(speed < 1,
  stepSeg.visible = false; 
  
  rollDice();
  newPoint();

,

  s = round(speed);

  if(tickCounter == 0,
      rollDice();
  );

  if(tickCounter == s,
      setDir();
  );

  if(tickCounter == 2 * s,
      newPoint();
  );

  if(tickCounter == 3 * s,
      stepSeg.visible = false;
  );
);
;

</script>

<script id="csinit" type="text/x-cindyscript">
// -------- Layout --------
bgcolor   = 1/255 * [51, 44, 68];
drawcolor = [1, 1, 1];
btnCol    = [0.08, 0.45, 0.54];

// -------- Stadion --------
l = 7;
r = 5;

SW = [-l, -r];  SE = [l, -r];
NW = [-l,  r];  NE = [l,  r];
CW = [-l, 0];   CE = [l,  0];

drawStadium() := (
    drawcircle(CW, r, color -> drawcolor, size -> 5, layer -> -1);
    drawcircle(CE, r, color -> drawcolor, size -> 5, layer -> -1);
    fillpoly([SW, SE, NE, NW], color -> bgcolor, layer -> -100);
    draw([SW, SE], color -> drawcolor, size -> 5);
    draw([NW, NE], color -> drawcolor, size -> 5);
);

// -------- Slider-Werte (Initialwerte) --------
vN = round(1 + |slNP - slNS| / |slNE - slNS| * 999);
vD = round(|slDP - slDS| / |slDE - slDS| * 7);
// Speed: logarithmisch von 0.1 bis 6 (Mitte = ca. 0.63)
tSp   = |slSpP - slSpS| / |slSpE - slSpS|;
speed = 0.1 * (6/0.1)^tSp;

// -------- Sim-Parameter --------
startC = [0, r * 0.25];
br     = 0.1;
eps    = 0.01;
reff   = r - br - eps;

running = false;

// -------- Listen-basierter Sim-State --------
positions  = [];
velocities = [];
colors     = [];
sizes      = [];

hsv2rgb(h) := (
    i = floor(h * 6);
    f = h * 6 - i;
    j = mod(i, 6);
    if(j == 0, [1, f, 0],
    if(j == 1, [1-f, 1, 0],
    if(j == 2, [0, 1, f],
    if(j == 3, [0, 1-f, 1],
    if(j == 4, [f, 0, 1],
              [1, 0, 1-f]
    )))));
);

resetSim() := (
    N = vN;
    d = 10^(-vD);
    v0 = 3 * [r * 0.02, r * 0.015];

    positions = apply(1..N, i,
        if(i == N,
            startC,
            startC + (d/2) * [cos(2*pi*(i-1)/(N-1)), sin(2*pi*(i-1)/(N-1))]
        )
    );
    velocities = apply(1..N, i, v0);
    colors = apply(1..N, i, if(i == N, [1,1,1], hsv2rgb(5/6 * (i-1)/(N-1))));
    sizes      = apply(1..N, i, if(i == N, 7, 5));
);

resetSim();

// Animation laufen lassen, Steuerung erfolgt über 'running'
playanimation();
</script>

<script id="csmousedown" type="text/x-cindyscript">
// Start/Pause-Button
if(mouse().x > btnLeft  & mouse().x < btnRight &
   mouse().y > btnBottom & mouse().y < btnTop,
    running = !running;
);

// Reset-Button
if(mouse().x > btnRLeft  & mouse().x < btnRRight &
   mouse().y > btnRBottom & mouse().y < btnRTop,
    running = false;
    resetSim();
);
</script>

<script id="csdraw" type="text/x-cindyscript">
drawStadium();

// -------- Slider-Werte live berechnen --------
vN = round(1 + |slNP - slNS| / |slNE - slNS| * 999);
vD = round(|slDP - slDS| / |slDE - slDS| * 7);
tSp   = |slSpP - slSpS| / |slSpE - slSpS|;
speed = 0.1 * (6/0.1)^tSp;

drawtext(slNP, vN, size -> 24, color -> [1,1,1], yoffset -> 20, align -> "mid");
drawtext(slDP, format(10^(-vD), 9), size -> 24, color -> [1,1,1], yoffset -> 20, align -> "mid");

// -------- Punkte zeichnen --------
forall(1..length(positions), i,
    draw(positions_i, color -> colors_i, size -> sizes_i);
);

// Slider-Beschriftungen (zentriert unter dem jeweiligen Slider)
drawtext([-7.5, -7.3], "Number of Points", size -> 24, color -> [1,1,1], align -> "mid");
drawtext([-2.0, -7.3], "Start Distance",   size -> 24, color -> [1,1,1], align -> "mid");
drawtext([ 3.5, -7.3], "Animation Speed",  size -> 24, color -> [1,1,1], align -> "mid");

// Einheitslabel "1" neben dem Referenzsegment
drawtext([9.39, -6.35], "1", size -> 24, color -> [1,1,1], align -> "mid");

// -------- Start/Pause-Button --------
btnCx     = -11;
btnCy     = -6.5;
btnW      = 120 / screenresolution();
btnH      = 60  / screenresolution();
btnLeft   = btnCx - btnW/2;
btnRight  = btnCx + btnW/2;
btnBottom = btnCy - btnH/2;
btnTop    = btnCy + btnH/2;

rectBtn = [[btnLeft, btnBottom], [btnRight, btnBottom],
           [btnRight, btnTop],   [btnLeft, btnTop]];

fillpoly(rectBtn, color -> btnCol, alpha -> 1);
drawtext([btnCx, btnCy],
    if(running, "Pause", "Start"),
    align -> "mid", size -> 24, color -> [1,1,1], yoffset -> -8);

// -------- Reset-Button --------
btnRCx     = 7;
btnRCy     = -6.5;
btnRLeft   = btnRCx - btnW/2;
btnRRight  = btnRCx + btnW/2;
btnRBottom = btnRCy - btnH/2;
btnRTop    = btnRCy + btnH/2;

rectBtnR = [[btnRLeft, btnRBottom], [btnRRight, btnRBottom],
            [btnRRight, btnRTop],   [btnRLeft, btnRTop]];

fillpoly(rectBtnR, color -> btnCol, alpha -> 1);
drawtext([btnRCx, btnRCy], "Reset",
    align -> "mid", size -> 24, color -> [1,1,1], yoffset -> -8);

// -------- Credit (unten rechts, an Bildschirmgröße angepasst) --------
sb       = screenbounds();
rightX   = max(apply(sb, p, p.x));
bottomY  = min(apply(sb, p, p.y));
marginPx = 50 / screenresolution();
drawtext([rightX - marginPx, bottomY + marginPx],
    "Max Hoffmann, v2026APR13, max.hoffmann@math.uni-paderborn.de",
    align -> "right", size -> 20, color -> [1,1,1]);

</script>

<script id="cstick" type="text/x-cindyscript">
if(running,
    forall(1..length(positions), i,
        p  = positions_i + velocities_i * 0.1 * speed;
        vv = velocities_i;
        hit = false;
        nn = [0, 0];

        // ZONE 1: Mittelteil
        if(abs(p.x) <= l,
            if(p.y >  reff, hit = true; nn = [0, -1]; p = [p.x,  reff]);
            if(p.y < -reff, hit = true; nn = [0,  1]; p = [p.x, -reff]);
        );

        // ZONE 2: rechter Halbkreis
        if(p.x > l,
            dd = dist(p, [l, 0]);
            if(dd > reff,
                hit = true;
                nn = ([l, 0] - p) / dd;
                p  = [l, 0] - nn * reff;
            );
        );

        // ZONE 3: linker Halbkreis
        if(p.x < -l,
            dd = dist(p, [-l, 0]);
            if(dd > reff,
                hit = true;
                nn = ([-l, 0] - p) / dd;
                p  = [-l, 0] - nn * reff;
            );
        );

        // Reflexion
        if(hit, vv = vv - 2 * (vv * nn) * nn);

        positions_i  = p;
        velocities_i = vv;
    );
);
</script>
